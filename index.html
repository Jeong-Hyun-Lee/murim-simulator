<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치·홈 인디케이터 안전 영역을 CSS env()로 처리.
         interactive-widget: 안드로이드 크롬에서 키보드가 뜨면 화면 높이를 줄여 입력창이 가려지지 않게 함. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#15130f" />
    <!-- iOS Safari가 전투력·재화 같은 긴 숫자를 전화번호 링크로 바꾸지 않게 함. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- 홈 화면에 추가해 실행할 때 브라우저 틀 없이 전체 화면으로 표시(iOS·안드로이드). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="무림인 키우기" />
    <title>무림인 키우기</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%94%EF%B8%8F</text></svg>"
    />
    <!-- 제목(h1~h3)용 붓글씨체 — 본문은 기존 시스템 폰트 유지. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
