<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>무림인 키우기</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%94%EF%B8%8F</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="battle-canvas" width="960" height="540"></canvas>
      <div id="ui-overlay">
        <div id="top-bar">
          <span id="stage-label">1-1</span>
          <span id="gold-label">전 0</span>
          <span id="chi-label">내공 0</span>
          <button id="gong-toggle-btn">무공</button>
          <button id="equip-toggle-btn">장구</button>
          <button id="rebirth-toggle-btn">환골탈태</button>
          <button id="pause-toggle-btn">일시정지</button>
        </div>
        <div id="player-status">
          <span id="level-label">Lv.1</span>
          <div class="bar hp-bar"><div id="player-hp-fill" class="bar-fill"></div></div>
          <div class="bar exp-bar"><div id="player-exp-fill" class="bar-fill"></div></div>
        </div>
        <div id="enemy-status">
          <span id="enemy-name-label"></span>
          <div class="bar hp-bar"><div id="enemy-hp-fill" class="bar-fill"></div></div>
        </div>
        <div id="log-toast"></div>
      </div>
      <div id="gong-panel" class="stat-panel" hidden>
        <div id="gong-panel-header">
          <span>삼재검법 1보</span>
          <button id="gong-close-btn">닫기</button>
        </div>
        <div id="gong-node-list"></div>
      </div>
      <div id="equip-panel" class="stat-panel" hidden>
        <div id="gong-panel-header">
          <span>장구 — 무기</span>
          <button id="equip-close-btn">닫기</button>
        </div>
        <div id="equip-node-list"></div>
      </div>
      <div id="rebirth-panel" class="stat-panel" hidden>
        <div id="gong-panel-header">
          <span>환골탈태(換骨奪胎)</span>
          <button id="rebirth-close-btn">닫기</button>
        </div>
        <div id="rebirth-body"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
