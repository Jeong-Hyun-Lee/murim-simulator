<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="960" height="620" fill="#f8f1df"/>
  <rect x="10" y="10" width="940" height="600" fill="none" stroke="#c9b98f" stroke-width="1"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#2a2118">버튼 상태 · 무협 용어 매핑</text>
  <text x="30" y="62" font-size="13" fill="#6b5f4c">전 화면 재사용 버튼 상태 5종과, 무협 서사 용어 → 실제 UX 요소 치환 표.</text>
  <g transform="translate(886,26) rotate(-4)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="none" stroke="#8c2f2f" stroke-width="2"/>
    <text x="0" y="8" font-size="20" font-weight="700" fill="#8c2f2f" text-anchor="middle">肆</text>
  </g>

  <!-- state cards -->
  <g transform="translate(30,90)">
    <g>
      <rect width="168" height="90" rx="6" fill="#eae0c7" stroke="#c9b98f"/>
      <rect x="14" y="14" width="140" height="24" rx="3" fill="#93691a"/>
      <text x="84" y="30" font-size="10" font-weight="700" fill="#f8f1df" text-anchor="middle">연마하기</text>
      <text x="84" y="66" font-size="9.5" fill="#6b5f4c" text-anchor="middle">활성 · 강화 가능</text>
    </g>
    <g transform="translate(180,0)">
      <rect width="168" height="90" rx="6" fill="#eae0c7" stroke="#c9b98f"/>
      <rect x="14" y="14" width="140" height="24" rx="3" fill="#ded1ae" stroke="#93691a"/>
      <text x="84" y="30" font-size="10" font-weight="700" fill="#b98f2e" text-anchor="middle">연마하기</text>
      <text x="84" y="66" font-size="9.5" fill="#6b5f4c" text-anchor="middle">추천 · 골드 테두리</text>
    </g>
    <g transform="translate(360,0)">
      <rect width="168" height="90" rx="6" fill="#eae0c7" stroke="#c9b98f"/>
      <rect x="14" y="14" width="140" height="24" rx="3" fill="#ded1ae"/>
      <text x="84" y="30" font-size="10" font-weight="700" fill="#9a8f78" text-anchor="middle">연마하기</text>
      <text x="84" y="66" font-size="9.5" fill="#6b5f4c" text-anchor="middle">비활성 · 재화 부족</text>
    </g>
    <g transform="translate(540,0)">
      <rect width="168" height="90" rx="6" fill="#eae0c7" stroke="#c9b98f"/>
      <rect x="14" y="14" width="140" height="24" rx="3" fill="none" stroke="#9a8f78"/>
      <text x="84" y="30" font-size="10" font-weight="700" fill="#9a8f78" text-anchor="middle">🔒 잠김</text>
      <text x="84" y="66" font-size="9.5" fill="#6b5f4c" text-anchor="middle">잠김 · 해금 조건 필요</text>
    </g>
    <g transform="translate(720,0)">
      <rect width="168" height="90" rx="6" fill="#eae0c7" stroke="#c9b98f"/>
      <rect x="14" y="14" width="140" height="24" rx="3" fill="#5d7d55"/>
      <text x="84" y="30" font-size="10" font-weight="700" fill="#f2f5ee" text-anchor="middle">대성</text>
      <text x="84" y="66" font-size="9.5" fill="#6b5f4c" text-anchor="middle">최대 달성</text>
    </g>
  </g>

  <!-- terms table -->
  <g transform="translate(30,220)">
    <text font-size="9.5" font-weight="700" letter-spacing="1" fill="#6b5f4c">무협 용어</text>
    <text x="160" font-size="9.5" font-weight="700" letter-spacing="1" fill="#6b5f4c">UX 요소</text>
    <text x="330" font-size="9.5" font-weight="700" letter-spacing="1" fill="#6b5f4c">설명</text>
    <line x1="0" y1="10" x2="900" y2="10" stroke="#c9b98f"/>

    <g font-size="12" fill="#2a2118">
      <text y="36" fill="#b98f2e" font-weight="700">내공</text>
      <text x="160" y="36">기본 성장 재화</text>
      <text x="330" y="36" fill="#6b5f4c">스테이지 클리어로 획득, 강화의 기본 소모 재화</text>
      <line x1="0" y1="46" x2="900" y2="46" stroke="#ded1ae"/>

      <text y="70" fill="#b98f2e" font-weight="700">영약</text>
      <text x="160" y="70">프리미엄 재화</text>
      <text x="330" y="70" fill="#6b5f4c">과금/희귀 획득, 즉시강화·시간단축 등에 사용</text>
      <line x1="0" y1="80" x2="900" y2="80" stroke="#ded1ae"/>

      <text y="104" fill="#b98f2e" font-weight="700">무공 보드</text>
      <text x="160" y="104">스킬 트리 화면</text>
      <text x="330" y="104" fill="#6b5f4c">"삼재검법", "태극권" 등 트리 1개 = 보드 1개</text>
      <line x1="0" y1="114" x2="900" y2="114" stroke="#ded1ae"/>

      <text y="138" fill="#b98f2e" font-weight="700">연마(鍊磨)</text>
      <text x="160" y="138">노드 업그레이드</text>
      <text x="330" y="138" fill="#6b5f4c">노드 카드의 업그레이드 버튼 라벨</text>
      <line x1="0" y1="148" x2="900" y2="148" stroke="#ded1ae"/>

      <text y="172" fill="#b98f2e" font-weight="700">대성(大成)</text>
      <text x="160" y="172">노드/보드 만렙</text>
      <text x="330" y="172" fill="#6b5f4c">더 이상 강화 불가한 최대치 상태</text>
      <line x1="0" y1="182" x2="900" y2="182" stroke="#ded1ae"/>

      <text y="206" fill="#b98f2e" font-weight="700">관문(關門)</text>
      <text x="160" y="206">스테이지 단위</text>
      <text x="330" y="206" fill="#6b5f4c">대스테이지=장(章), 소스테이지=관(關)</text>
      <line x1="0" y1="216" x2="900" y2="216" stroke="#ded1ae"/>

      <text y="240" fill="#b98f2e" font-weight="700">운기조식</text>
      <text x="160" y="240">자동전투 토글</text>
      <text x="330" y="240" fill="#6b5f4c">켜짐 상태 = 자동 진행 인디케이터</text>
      <line x1="0" y1="250" x2="900" y2="250" stroke="#ded1ae"/>

      <text y="274" fill="#b98f2e" font-weight="700">환골탈태</text>
      <text x="160" y="274">리셋/프레스티지</text>
      <text x="330" y="274" fill="#6b5f4c">조건 달성 후 초기화, 영구 배율 버프 획득</text>
    </g>
  </g>
</svg>
