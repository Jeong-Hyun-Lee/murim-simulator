<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="960" height="480" fill="#f8f1df"/>
  <rect x="10" y="10" width="940" height="460" fill="none" stroke="#c9b98f" stroke-width="1"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#2a2118">관문 진행바 · 보스 조우</text>
  <text x="30" y="62" font-size="13" fill="#6b5f4c">10칸 세그먼트, 10번째 칸(보스)은 크기·색으로 강조. 보스 조우 직전엔 자동전투를 멈추고 확인 다이얼로그 표시.</text>
  <g transform="translate(886,26) rotate(-4)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="none" stroke="#8c2f2f" stroke-width="2"/>
    <text x="0" y="8" font-size="20" font-weight="700" fill="#8c2f2f" text-anchor="middle">參</text>
  </g>

  <!-- left col -->
  <g transform="translate(40,110)">
    <text font-size="12" font-weight="700" letter-spacing="1" fill="#b98f2e">클리어 토스트</text>
    <g transform="translate(0,16)">
      <rect width="260" height="34" rx="17" fill="#eae0c7" stroke="#c9b98f"/>
      <circle cx="20" cy="17" r="4" fill="#b98f2e"/>
      <text x="32" y="22" font-size="11" fill="#2a2118">내공 +820 · 낡은 목검 획득</text>
    </g>

    <text y="100" font-size="12" font-weight="700" letter-spacing="1" fill="#b98f2e">진행바 상태</text>
    <g transform="translate(0,116)">
      <rect width="330" height="26" rx="13" fill="#eae0c7" stroke="#c9b98f"/>
      <text x="14" y="17" font-size="9" fill="#2a2118">5-1</text>
      <circle cx="46" cy="13" r="4" fill="#b98f2e"/>
      <circle cx="60" cy="13" r="4" fill="#b98f2e"/>
      <circle cx="74" cy="13" r="4" fill="#b98f2e"/>
      <circle cx="88" cy="13" r="4" fill="#b98f2e"/>
      <circle cx="102" cy="13" r="4.5" fill="#93691a"/>
      <circle cx="118" cy="13" r="4" fill="#ded1ae" stroke="#c9b98f"/>
      <circle cx="132" cy="13" r="4" fill="#ded1ae" stroke="#c9b98f"/>
      <circle cx="146" cy="13" r="4" fill="#ded1ae" stroke="#c9b98f"/>
      <circle cx="160" cy="13" r="4" fill="#ded1ae" stroke="#c9b98f"/>
      <circle cx="180" cy="13" r="7" fill="#8c2f2f"/>
      <text x="300" y="17" font-size="9" fill="#2a2118">5-10</text>
    </g>
  </g>

  <!-- right col: boss modal -->
  <g transform="translate(500,100)">
    <text font-size="12" font-weight="700" letter-spacing="1" fill="#b98f2e">보스 예고 다이얼로그</text>
    <g transform="translate(0,20)">
      <rect width="380" height="240" rx="8" fill="#eae0c7" stroke="#8c2f2f" stroke-width="1.5"/>
      <rect x="20" y="20" width="340" height="80" rx="6" fill="#a85a4a" fill-opacity="0.5"/>
      <text x="20" y="122" font-size="15" font-weight="700" fill="#2a2118">혈교 살수 두목</text>
      <text x="20" y="140" font-size="11" fill="#6b5f4c">5-10 보스 · 방어막 페이즈 기믹</text>

      <text x="20" y="164" font-size="10" fill="#6b5f4c">내 전투력</text>
      <rect x="90" y="157" width="200" height="8" rx="4" fill="#ded1ae"/>
      <rect x="90" y="157" width="124" height="8" rx="4" fill="#b98f2e"/>

      <text x="20" y="182" font-size="10" fill="#6b5f4c">권장 전투력</text>
      <rect x="90" y="175" width="200" height="8" rx="4" fill="#ded1ae"/>
      <rect x="90" y="175" width="200" height="8" rx="4" fill="#a85a4a"/>

      <rect x="270" y="200" width="90" height="26" rx="4" fill="#93691a"/>
      <text x="315" y="217" font-size="11" font-weight="700" fill="#f8f1df" text-anchor="middle">도전</text>
    </g>
  </g>
</svg>
