<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <!--
    source: wiki/concepts/배경-아트-컨셉.md 컨셉1 "청운문 대련장(對鍊場)" — 메인 화면(성장보드) 배경
    tone: wiki/concepts/비주얼-디자인-시스템.md 다크 무협 HUD 공식 팔레트
    created: 2026-07-31
  -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2ece0" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#e8bc55" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8bc55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14100e"/>
      <stop offset="100%" stop-color="#1c1712"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="960" height="540" fill="url(#sky)"/>
  <circle cx="480" cy="86" r="100" fill="url(#moonGlow)"/>
  <circle cx="480" cy="86" r="22" fill="#f2ece0"/>
  <ellipse cx="360" cy="70" rx="120" ry="8" fill="#f2ece0" opacity="0.06"/>
  <ellipse cx="620" cy="100" rx="150" ry="7" fill="#f2ece0" opacity="0.05"/>
  <circle cx="140" cy="60" r="1.4" fill="#f2ece0" opacity="0.6"/>
  <circle cx="810" cy="120" r="1.2" fill="#f2ece0" opacity="0.5"/>
  <circle cx="700" cy="50" r="1" fill="#f2ece0" opacity="0.5"/>

  <!-- 원경: 첩첩 산 (농담 원근) -->
  <polygon points="0,300 90,255 190,285 300,240 420,270 540,235 660,275 780,245 880,270 960,250 960,540 0,540" fill="#201913"/>
  <polygon points="0,340 120,300 230,325 350,290 470,320 600,285 720,320 840,295 960,315 960,540 0,540" fill="#2c2118"/>
  <polygon points="0,380 100,350 240,372 360,340 500,368 640,335 780,370 900,345 960,360 960,540 0,540" fill="#3a2b1e"/>

  <!-- 중경: 청운문 본전 -->
  <g>
    <rect x="360" y="340" width="240" height="80" fill="#241c16"/>
    <polygon points="335,340 480,290 625,340" fill="#241c16" stroke="#463525" stroke-width="2"/>
    <polygon points="335,340 480,300 625,340 480,310" fill="#463525" opacity="0.5"/>
    <rect x="392" y="365" width="30" height="40" fill="#c9924a" opacity="0.55" filter="url(#softGlow)"/>
    <rect x="538" y="365" width="30" height="40" fill="#c9924a" opacity="0.55" filter="url(#softGlow)"/>
    <rect x="465" y="378" width="30" height="42" fill="#1a140f"/>
    <!-- 처마 등불 -->
    <circle cx="352" cy="330" r="6" fill="#e8bc55" filter="url(#softGlow)"/>
    <circle cx="608" cy="330" r="6" fill="#e8bc55" filter="url(#softGlow)"/>
    <circle cx="480" cy="322" r="5" fill="#e8bc55" filter="url(#softGlow)"/>
  </g>
  <!-- 담장·계단 -->
  <rect x="300" y="400" width="60" height="20" fill="#221a13"/>
  <rect x="600" y="400" width="60" height="20" fill="#221a13"/>
  <polygon points="260,420 300,420 300,440 260,440" fill="#1c1611"/>
  <!-- 마른 소나무 실루엣 -->
  <g fill="#1c1611">
    <rect x="250" y="380" width="4" height="45" />
    <ellipse cx="252" cy="378" rx="18" ry="10"/>
    <ellipse cx="240" cy="392" rx="14" ry="8"/>
    <rect x="700" y="378" width="4" height="47"/>
    <ellipse cx="702" cy="376" rx="16" ry="9"/>
  </g>

  <!-- 근경: 기둥 + 청운문 깃발 -->
  <g>
    <rect x="60" y="330" width="18" height="150" fill="#1a1310"/>
    <polygon points="78,340 130,352 130,392 78,384" fill="#1f2a33"/>
    <circle cx="70" cy="452" r="10" fill="#e8bc55" opacity="0.85" filter="url(#softGlow)"/>

    <rect x="882" y="330" width="18" height="150" fill="#1a1310"/>
    <polygon points="882,340 830,352 830,392 882,384" fill="#1f2a33"/>
    <circle cx="890" cy="452" r="10" fill="#e8bc55" opacity="0.85" filter="url(#softGlow)"/>
  </g>

  <!-- 바닥 -->
  <rect x="0" y="470" width="960" height="70" fill="#2a221a"/>
  <ellipse cx="480" cy="472" rx="420" ry="10" fill="#4a4030" opacity="0.2"/>
</svg>
