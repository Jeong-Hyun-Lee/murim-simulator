<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <!--
    source: wiki/concepts/에셋-아트-컨셉.md — 주인공 idle/attack, 혈랑채 두목+잡몹, 삼재검법 1보 노드 아이콘 7종
    tone: wiki/concepts/비주얼-디자인-시스템.md 다크 무협 HUD 공식 팔레트
    created: 2026-07-31
    주의: 실제 도트 스프라이트가 아니라 실루엣/색상/구성을 확정하는 컨셉 레퍼런스 시트다 (Aseprite MCP 미연결).
  -->
  <defs>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="760" fill="#100d0a"/>

  <!-- ============ SECTION 1: 주인공 강진우(목현) idle / attack ============ -->
  <rect x="20" y="20" width="920" height="230" rx="6" fill="#1b150f" stroke="#8a6a2c" stroke-opacity="0.4"/>
  <text x="40" y="46" fill="#f2d27a" font-size="12" font-weight="700" letter-spacing="1">01 · 주인공 강진우(무림명 목현) — idle / attack</text>
  <text x="40" y="64" fill="#9c9284" font-size="10.5">현대 펜싱 국가대표 출신 · 6.5~7등신 슬림형 · 짧은 흑발 · 청운문 무명 경장(#4a3f35) · 얇고 직선적인 목검</text>

  <!-- idle figure -->
  <g transform="translate(160,90)">
    <text x="0" y="-10" fill="#9c9284" font-size="10" text-anchor="middle">idle · 좁은 스탠스(펜싱 앙가르드 변형)</text>
    <ellipse cx="0" cy="150" rx="34" ry="6" fill="#000" opacity="0.35"/>
    <rect x="-16" y="46" width="14" height="60" rx="4" fill="#4a3f35"/>
    <rect x="4" y="50" width="13" height="56" rx="4" fill="#4a3f35"/>
    <rect x="-13" y="0" width="28" height="50" rx="6" fill="#5a4d40"/>
    <rect x="-11" y="14" width="6" height="26" fill="#3a3128"/>
    <circle cx="0" cy="-16" r="15" fill="#e8c9a0"/>
    <path d="M-15,-22 q15,-16 30,0 q-2,-10 -15,-11 q-13,1 -15,11 z" fill="#161210"/>
    <rect x="14" y="0" width="4" height="42" rx="2" fill="#dce6e8" transform="rotate(18 14 0)"/>
    <rect x="-24" y="4" width="10" height="30" rx="4" fill="#5a4d40"/>
    <rect x="16" y="4" width="10" height="30" rx="4" fill="#5a4d40" transform="rotate(-10 16 4)"/>
  </g>

  <!-- attack figure -->
  <g transform="translate(340,90)">
    <text x="10" y="-10" fill="#9c9284" font-size="10" text-anchor="middle">attack · 렁지 찌르기(직선 궤적)</text>
    <ellipse cx="10" cy="150" rx="40" ry="6" fill="#000" opacity="0.35"/>
    <rect x="-24" y="50" width="13" height="56" rx="4" fill="#4a3f35" transform="rotate(-8 -24 50)"/>
    <rect x="18" y="46" width="14" height="60" rx="4" fill="#4a3f35" transform="rotate(12 18 46)"/>
    <rect x="-13" y="0" width="28" height="50" rx="6" fill="#5a4d40" transform="rotate(-6 0 0)"/>
    <circle cx="-2" cy="-16" r="15" fill="#e8c9a0"/>
    <path d="M-17,-22 q15,-16 30,0 q-2,-10 -15,-11 q-13,1 -15,11 z" fill="#161210"/>
    <rect x="8" y="-6" width="4" height="58" rx="2" fill="#dce6e8" transform="rotate(78 8 -6)"/>
    <line x1="10" y1="-4" x2="70" y2="6" stroke="#dce6e8" stroke-width="2" opacity="0.5"/>
    <line x1="6" y1="-10" x2="62" y2="-4" stroke="#dce6e8" stroke-width="1.4" opacity="0.3"/>
    <rect x="-30" y="0" width="10" height="30" rx="4" fill="#5a4d40" transform="rotate(20 -30 0)"/>
  </g>

  <!-- ============ SECTION 2: 혈랑채 두목 + 잡몹 ============ -->
  <rect x="20" y="266" width="920" height="230" rx="6" fill="#1b150f" stroke="#8a6a2c" stroke-opacity="0.4"/>
  <text x="40" y="292" fill="#f2d27a" font-size="12" font-weight="700" letter-spacing="1">02 · 대1 스테이지 — 혈랑채 두목 · 잡몹 3종</text>
  <text x="40" y="310" fill="#9c9284" font-size="10.5">두목은 캐릭터 대비 1.4배, 완력형 비대 체형 · 박도(두껍고 육중) · 붉은 포인트로 소속 통일</text>

  <!-- 두목 -->
  <g transform="translate(150,340) scale(1.3)">
    <text x="10" y="-10" fill="#e2776d" font-size="8.5" text-anchor="middle">혈랑채 두목</text>
    <ellipse cx="10" cy="118" rx="30" ry="6" fill="#000" opacity="0.35"/>
    <rect x="-6" y="40" width="14" height="48" rx="4" fill="#5c4530"/>
    <rect x="14" y="40" width="14" height="48" rx="4" fill="#5c4530"/>
    <ellipse cx="10" cy="10" rx="26" ry="34" fill="#6b5138"/>
    <circle cx="10" cy="-24" r="14" fill="#c99a72"/>
    <path d="M-4,-32 q14,-8 28,0" stroke="#2b1f14" stroke-width="5" fill="none"/>
    <rect x="-6" y="-40" width="32" height="9" rx="3" fill="#7a1f18"/>
    <rect x="34" y="-4" width="7" height="52" rx="2" fill="#8a8a8a" transform="rotate(35 34 -4)"/>
    <rect x="-20" y="0" width="12" height="34" rx="5" fill="#6b5138"/>
    <rect x="30" y="-6" width="12" height="34" rx="5" fill="#6b5138" transform="rotate(20 30 -6)"/>
    <rect x="4" y="-2" width="10" height="8" rx="2" fill="#5a4530"/>
  </g>

  <!-- 잡몹 3종 -->
  <g transform="translate(340,368)">
    <text x="0" y="-46" fill="#9c9284" font-size="8.5" text-anchor="middle">졸개</text>
    <rect x="-9" y="-8" width="9" height="36" rx="3" fill="#5c4530"/>
    <rect x="1" y="-8" width="9" height="36" rx="3" fill="#5c4530"/>
    <ellipse cx="0" cy="-30" rx="16" ry="22" fill="#6b5138"/>
    <circle cx="0" cy="-52" r="10" fill="#c99a72"/>
    <rect x="9" y="-40" width="5" height="30" rx="2" fill="#8a8a8a" transform="rotate(30 9 -40)"/>
  </g>
  <g transform="translate(430,368)">
    <text x="0" y="-46" fill="#9c9284" font-size="8.5" text-anchor="middle">궁수</text>
    <rect x="-9" y="-8" width="9" height="36" rx="3" fill="#5c4530"/>
    <rect x="1" y="-8" width="9" height="36" rx="3" fill="#5c4530"/>
    <ellipse cx="0" cy="-30" rx="16" ry="22" fill="#6b5138"/>
    <circle cx="0" cy="-52" r="10" fill="#c99a72"/>
    <path d="M14,-52 q16,10 0,32" stroke="#8a6a2c" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(520,368)">
    <text x="0" y="-46" fill="#9c9284" font-size="8.5" text-anchor="middle">정예 산적</text>
    <rect x="-10" y="-8" width="10" height="38" rx="3" fill="#5c4530"/>
    <rect x="2" y="-8" width="10" height="38" rx="3" fill="#5c4530"/>
    <ellipse cx="0" cy="-32" rx="18" ry="24" fill="#7a5f42"/>
    <circle cx="0" cy="-56" r="11" fill="#c99a72"/>
    <rect x="-3" y="-64" width="20" height="6" rx="2" fill="#5c1f1a"/>
    <rect x="12" y="-44" width="6" height="34" rx="2" fill="#8a8a8a" transform="rotate(28 12 -44)"/>
  </g>

  <!-- 등급/보스 프레임 참고 -->
  <g transform="translate(720,340)">
    <text x="0" y="-40" fill="#9c9284" font-size="8.5" text-anchor="middle">보스 스테이지 프레임</text>
    <rect x="-45" y="-25" width="90" height="90" rx="10" fill="#161210" stroke="#d6534a" stroke-width="3"/>
    <rect x="-40" y="-20" width="80" height="80" rx="7" fill="none" stroke="#d6534a" stroke-width="1" opacity="0.5"/>
    <text x="0" y="24" fill="#d6534a" font-size="22" text-anchor="middle" filter="url(#glow)">寨</text>
  </g>

  <!-- ============ SECTION 3: 삼재검법 1보 노드 아이콘 7종 ============ -->
  <rect x="20" y="512" width="920" height="230" rx="6" fill="#1b150f" stroke="#8a6a2c" stroke-opacity="0.4"/>
  <text x="40" y="538" fill="#f2d27a" font-size="12" font-weight="700" letter-spacing="1">03 · 삼재검법 1보 — 노드 아이콘 7종 (천/지/인 삼재 모티프)</text>
  <text x="40" y="556" fill="#9c9284" font-size="10.5">32×32 원본, 원형 노드 프레임 64px. 뿌리→1차×3→2차×2→캡스톤 순으로 배치</text>

  <!-- connecting lines -->
  <g stroke="#8a6a2c" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="118" y1="640" x2="230" y2="590"/>
    <line x1="118" y1="640" x2="230" y2="640"/>
    <line x1="118" y1="640" x2="230" y2="690"/>
    <line x1="270" y1="590" x2="420" y2="615"/>
    <line x1="270" y1="640" x2="420" y2="615"/>
    <line x1="270" y1="690" x2="420" y2="690"/>
    <line x1="460" y1="615" x2="620" y2="640"/>
    <line x1="460" y1="690" x2="620" y2="640"/>
  </g>

  <!-- 기수식 -->
  <g transform="translate(78,640)">
    <circle r="40" fill="#161210" stroke="#c9c9c9" stroke-width="2"/>
    <text y="8" fill="#c9c9c9" font-size="22" text-anchor="middle">起</text>
    <text y="56" fill="#9c9284" font-size="9" text-anchor="middle">기수식</text>
  </g>
  <!-- 1차 x3 -->
  <g transform="translate(230,590)">
    <circle r="36" fill="#161210" stroke="#7ec8e3" stroke-width="2"/>
    <text y="7" fill="#7ec8e3" font-size="20" text-anchor="middle">天</text>
    <text y="52" fill="#9c9284" font-size="9" text-anchor="middle">1차-천</text>
  </g>
  <g transform="translate(230,640)">
    <circle r="36" fill="#161210" stroke="#c9a15a" stroke-width="2"/>
    <text y="7" fill="#c9a15a" font-size="20" text-anchor="middle">地</text>
    <text y="52" fill="#9c9284" font-size="9" text-anchor="middle">1차-지</text>
  </g>
  <g transform="translate(230,690)">
    <circle r="36" fill="#161210" stroke="#d9a679" stroke-width="2"/>
    <text y="7" fill="#d9a679" font-size="20" text-anchor="middle">人</text>
    <text y="52" fill="#9c9284" font-size="9" text-anchor="middle">1차-인</text>
  </g>
  <!-- 2차 x2 -->
  <g transform="translate(420,615)">
    <circle r="34" fill="#161210" stroke="#a8c8d0" stroke-width="2"/>
    <text y="7" fill="#a8c8d0" font-size="17" text-anchor="middle">天地</text>
    <text y="50" fill="#9c9284" font-size="9" text-anchor="middle">2차-천지합</text>
  </g>
  <g transform="translate(420,690)">
    <circle r="34" fill="#161210" stroke="#d9a679" stroke-width="2"/>
    <text y="7" fill="#d9a679" font-size="17" text-anchor="middle">人化</text>
    <text y="50" fill="#9c9284" font-size="9" text-anchor="middle">2차-인화</text>
  </g>
  <!-- 캡스톤 -->
  <g transform="translate(620,640)">
    <circle r="44" fill="#161210" stroke="#e8c468" stroke-width="3" filter="url(#glow)"/>
    <text y="9" fill="#e8c468" font-size="22" text-anchor="middle">合</text>
    <text y="60" fill="#f2d27a" font-size="9.5" text-anchor="middle">캡스톤 · 삼재합일</text>
  </g>

  <!-- 등급 프레임 레퍼런스 -->
  <g transform="translate(800,600)" font-size="9" fill="#9c9284">
    <text x="0" y="-24" fill="#9c9284">등급 프레임 참고</text>
    <circle cx="0" cy="0" r="14" fill="#161210" stroke="#9e9e9e" stroke-width="1"/>
    <circle cx="40" cy="0" r="14" fill="#161210" stroke="#4caf50" stroke-width="2"/>
    <circle cx="80" cy="0" r="14" fill="#161210" stroke="#2196f3" stroke-width="2"/>
    <circle cx="0" cy="40" r="14" fill="#161210" stroke="#9c27b0" stroke-width="3" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="14" fill="#161210" stroke="#ff9800" stroke-width="3" filter="url(#glow)"/>
    <circle cx="80" cy="40" r="14" fill="#161210" stroke="#e8bc55" stroke-width="3" filter="url(#glow)"/>
  </g>
</svg>
