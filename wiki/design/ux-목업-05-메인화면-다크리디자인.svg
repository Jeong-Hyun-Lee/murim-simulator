<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#e8bc55" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8bc55" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hardGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background canvas -->
  <rect x="0" y="0" width="960" height="540" fill="#14100e"/>
  <rect x="0" y="0" width="960" height="540" fill="url(#glow)"/>

  <!-- fighters -->
  <g filter="url(#softGlow)">
    <rect x="380" y="300" width="44" height="96" rx="8" fill="#e8bc55"/>
    <rect x="536" y="300" width="44" height="96" rx="8" fill="#d6534a"/>
  </g>
  <text x="480" y="356" font-size="26" fill="#e8bc55" text-anchor="middle">⚔</text>

  <!-- top HUD bar -->
  <rect x="0" y="0" width="960" height="50" fill="#1a1512" fill-opacity="0.82"/>
  <line x1="0" y1="50" x2="960" y2="50" stroke="#8a6a2c" stroke-opacity="0.6" stroke-width="1"/>
  <text x="18" y="30" font-family="'Noto Serif KR',serif" font-weight="700" font-size="15" fill="#e8bc55">俠 무림인 키우기</text>

  <!-- nav pills -->
  <g font-size="10.5">
    <text x="160" y="29" fill="#9c9284">스테이지</text>
    <rect x="200" y="15" width="46" height="20" rx="10" fill="#e8bc55" fill-opacity="0.22"/>
    <text x="223" y="29" fill="#e8bc55" font-weight="700" text-anchor="middle">무공</text>
    <text x="278" y="29" fill="#9c9284">장구</text>
    <text x="326" y="29" fill="#9c9284">문파</text>
    <text x="378" y="29" fill="#9c9284">환골탈태</text>
    <text x="440" y="29" fill="#9c9284">상점</text>
  </g>

  <!-- currency -->
  <g font-size="12" font-weight="700">
    <circle cx="700" cy="25" r="4" fill="#e8bc55"/>
    <text x="710" y="29" fill="#f2ece0">내공 1.2만</text>
    <path d="M810 21 l4 4 -4 4 -4 -4 z" fill="#e8bc55"/>
    <text x="822" y="29" fill="#f2ece0">영약 320</text>
  </g>

  <!-- progress pill -->
  <g transform="translate(368,64)">
    <rect x="0" y="0" width="224" height="25" rx="12.5" fill="#1a1512" fill-opacity="0.65" stroke="#8a6a2c" stroke-opacity="0.5"/>
    <text x="10" y="17" font-size="9" fill="#9c9284">3-1</text>
    <circle cx="40" cy="12.5" r="4" fill="#e8bc55" fill-opacity="0.55"/>
    <circle cx="55" cy="12.5" r="4" fill="#e8bc55" fill-opacity="0.55"/>
    <circle cx="70" cy="12.5" r="4" fill="#e8bc55" fill-opacity="0.55"/>
    <circle cx="86" cy="12.5" r="4.5" fill="#e8bc55" filter="url(#hardGlow)"/>
    <circle cx="102" cy="12.5" r="4" fill="#1a1512"/>
    <circle cx="117" cy="12.5" r="4" fill="#1a1512"/>
    <circle cx="132" cy="12.5" r="4" fill="#1a1512"/>
    <circle cx="147" cy="12.5" r="4" fill="#1a1512"/>
    <circle cx="162" cy="12.5" r="4" fill="#1a1512"/>
    <circle cx="180" cy="12.5" r="6.5" fill="#d6534a"/>
    <text x="196" y="17" font-size="9" fill="#9c9284">3-10</text>
  </g>

  <!-- bottom-left character card -->
  <g transform="translate(24,372)">
    <rect x="0" y="0" width="196" height="144" rx="10" fill="#1a1512" fill-opacity="0.78" stroke="#8a6a2c" stroke-opacity="0.5"/>
    <circle cx="34" cy="34" r="20" fill="#d6534a" fill-opacity="0.5" stroke="#e8bc55" stroke-width="1"/>
    <text x="66" y="30" font-size="13" font-weight="700" fill="#f2ece0">목현</text>
    <text x="66" y="45" font-size="9.5" fill="#e8bc55">후천 · 3성</text>

    <g font-size="8.5" fill="#9c9284">
      <text x="14" y="76">근골</text>
      <rect x="46" y="70" width="136" height="4" rx="2" fill="#211c17"/>
      <rect x="46" y="70" width="87" height="4" rx="2" fill="#e8bc55"/>
      <text x="14" y="92">오성</text>
      <rect x="46" y="86" width="136" height="4" rx="2" fill="#211c17"/>
      <rect x="46" y="86" width="65" height="4" rx="2" fill="#e8bc55"/>
      <text x="14" y="108">심법</text>
      <rect x="46" y="102" width="136" height="4" rx="2" fill="#211c17"/>
      <rect x="46" y="102" width="97" height="4" rx="2" fill="#e8bc55"/>
    </g>

    <text x="14" y="130" font-size="8.5" fill="#9c9284">전투력</text>
    <text x="60" y="133" font-size="18" font-weight="700" fill="#e8bc55" filter="url(#softGlow)">2,614</text>
  </g>

  <!-- top-right recommendation stack -->
  <g transform="translate(730,62)">
    <rect x="0" y="0" width="210" height="98" rx="10" fill="#1a1512" fill-opacity="0.8" stroke="#e8bc55" stroke-width="1"/>
    <text x="13" y="20" font-size="9" font-weight="700" fill="#e8bc55">★ 추천 수련</text>
    <text x="13" y="38" font-size="12.5" font-weight="700" fill="#f2ece0">삼재검법 1보 · Lv12</text>
    <text x="13" y="52" font-size="9" fill="#9c9284">"휘두르기" 다음 강화 대기중</text>
    <rect x="13" y="62" width="184" height="24" rx="6" fill="#e8bc55" filter="url(#softGlow)"/>
    <text x="105" y="78" font-size="10" font-weight="700" fill="#14100e" text-anchor="middle">연마하기 · 내공 1,200</text>

    <rect x="0" y="108" width="210" height="66" rx="10" fill="#1a1512" fill-opacity="0.6"/>
    <text x="13" y="128" font-size="9" fill="#f2ece0">▸ 삼재검법 1보</text>
    <text x="185" y="128" font-size="8" fill="#9c9284" text-anchor="end">진행중</text>
    <text x="13" y="146" font-size="9" fill="#f2ece0">▸ 태극권</text>
    <text x="185" y="146" font-size="8" fill="#9c9284" text-anchor="end">해금됨</text>
    <text x="13" y="164" font-size="9" fill="#9c9284">▸ 매화검법</text>
    <text x="185" y="164" font-size="8" fill="#9c9284" text-anchor="end">🔒 6-1</text>
  </g>

  <!-- bottom-center auto-battle toggle -->
  <g transform="translate(390,478)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#e8bc55" fill-opacity="0.22" stroke="#e8bc55" stroke-width="1" filter="url(#softGlow)"/>
    <circle cx="20" cy="17" r="7" fill="#e8bc55"/>
    <text x="35" y="21" font-size="10" font-weight="700" fill="#e8bc55">운기조식 자동전투 ON</text>
  </g>

  <!-- bottom-right corner links -->
  <g transform="translate(834,486)" font-size="9.5" fill="#9c9284">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#1a1512" fill-opacity="0.6"/>
    <text x="30" y="15" text-anchor="middle">퀘스트 ▾</text>
    <rect x="66" y="0" width="60" height="22" rx="11" fill="#1a1512" fill-opacity="0.6"/>
    <text x="96" y="15" text-anchor="middle">문파톡 ▾</text>
  </g>
</svg>
